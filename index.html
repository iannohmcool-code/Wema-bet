<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wema Bet Pro</title>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>

<style>
body { margin:0; font-family:Arial; background:#121212; color:white; }

.header { background:black; padding:10px; text-align:center; color:#00ff88; }

.screen { display:none; padding:15px; animation:fadeIn .3s; }
.active { display:block; }

button {
    padding:10px;
    margin-top:10px;
    width:100%;
    background:#00ff88;
    border:none;
    border-radius:6px;
    transition:.3s;
}
button:hover { transform:scale(1.05); }

.nav {
    position:fixed;
    bottom:0;
    width:100%;
    background:black;
    display:flex;
    justify-content:space-around;
    padding:10px;
}

#multiplier { font-size:40px; text-align:center; margin:20px 0; }

@keyframes fadeIn {
    from {opacity:0; transform:translateY(10px);}
    to {opacity:1;}
}
</style>
</head>

<body>

<div class="header">Wema Bet 💰</div>

<!-- LOGIN -->
<div id="login" class="screen active">
    <h2>Login / Register</h2>
    <input id="username" placeholder="Username"><br><br>
    <button onclick="register()">Register</button>
    <button onclick="login()">Login</button>
</div>

<!-- HOME -->
<div id="home" class="screen">
    <h3>Balance: KES <span id="balance">0</span></h3>

    <button onclick="showScreen('aviator')">Aviator ✈️</button>
    <button onclick="showScreen('dice')">Dice 🎲</button>
    <button onclick="showScreen('spin')">Spin 🎡</button>
    <button onclick="showScreen('wallet')">Wallet 💳</button>
    <button onclick="showScreen('admin')">Admin 🔐</button>
</div>

<!-- AVIATOR -->
<div id="aviator" class="screen">
    <h2>Aviator</h2>
    <div id="multiplier">1.00x</div>
    <input id="bet" type="number" value="10">
    <button onclick="startGame()">Start</button>
    <button onclick="cashout()">Cash Out</button>
    <p id="result"></p>
</div>

<!-- DICE -->
<div id="dice" class="screen">
    <h2>Dice 🎲</h2>
    <input id="dicePick" placeholder="1-6">
    <input id="diceBet" placeholder="Bet">
    <button onclick="playDice()">Roll</button>
    <p id="diceResult"></p>
</div>

<!-- SPIN -->
<div id="spin" class="screen">
    <h2>Spin 🎡</h2>
    <input id="spinBet" placeholder="Bet">
    <button onclick="spin()">Spin</button>
    <p id="spinResult"></p>
</div>

<!-- WALLET -->
<div id="wallet" class="screen">
    <h2>Wallet 💳</h2>

    Balance: KES <span id="walletBalance">0</span>

    <h3>Deposit</h3>
    <input id="depositAmount" placeholder="Amount">
    <button onclick="deposit()">Deposit</button>

    <h3>Withdraw</h3>
    <input id="withdrawAmount" placeholder="Amount">
    <button onclick="withdraw()">Withdraw</button>

    <div id="transactions"></div>
</div>

<!-- ADMIN -->
<div id="admin" class="screen">
    <h2>Admin Panel</h2>

    <h3>Deposits</h3>
    <div id="depositList"></div>
</div>

<!-- NAV -->
<div class="nav">
    <div onclick="showScreen('home')">Home</div>
    <div onclick="showScreen('aviator')">Aviator</div>
    <div onclick="showScreen('wallet')">Wallet</div>
</div>

<script>

/* 🔥 REPLACE WITH YOUR FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "PASTE_KEY",
  authDomain: "PASTE_DOMAIN",
  databaseURL: "PASTE_DB",
  projectId: "PASTE_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentUser = null;
let balance = 0;

/* NAV */
function showScreen(s){
    document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
    document.getElementById(s).classList.add("active");

    if(s==="admin") loadDeposits();
}

/* AUTH */
function register(){
    let name = document.getElementById("username").value;

    db.ref("users/"+name).set({
        balance:1000,
        isAdmin: name==="admin"
    });

    alert("Registered");
}

function login(){
    let name = document.getElementById("username").value;

    db.ref("users/"+name).once("value").then(s=>{
        if(s.exists()){
            currentUser = {name,...s.val()};
            balance = currentUser.balance;
            updateBalance();
            showScreen("home");
        } else alert("User not found");
    });
}

function updateBalance(){
    document.getElementById("balance").innerText = balance;
    document.getElementById("walletBalance").innerText = balance;

    db.ref("users/"+currentUser.name).update({balance});
}

/* WALLET */
function deposit(){
    let amount = Number(document.getElementById("depositAmount").value);

    alert("Send to 0748121890 (Ruian Global)");

    db.ref("deposits").push({
        user: currentUser.name,
        amount,
        status:"pending"
    });

    alert("Request sent");
}

function withdraw(){
    let amount = Number(document.getElementById("withdrawAmount").value);

    db.ref("withdraws").push({
        user: currentUser.name,
        amount,
        status:"pending"
    });

    alert("Withdraw requested");
}

/* ADMIN */
function loadDeposits(){
    db.ref("deposits").on("value", snap=>{
        let html="";
        snap.forEach(c=>{
            let d=c.val();

            html+=`
            ${d.user} - ${d.amount}
            <button onclick="approve('${c.key}','${d.user}',${d.amount})">Approve</button><br>`;
        });

        document.getElementById("depositList").innerHTML=html;
    });
}

function approve(id,user,amount){
    db.ref("users/"+user).once("value").then(s=>{
        let bal=s.val().balance+amount;
        db.ref("users/"+user).update({balance:bal});
        db.ref("deposits/"+id).update({status:"approved"});
    });
}

/* GAMES */
let gameRunning=false, multiplier=1, interval;

function startGame(){
    if(gameRunning) return;

    let bet=Number(document.getElementById("bet").value);
    if(bet>balance) return alert("No balance");

    balance-=bet;
    updateBalance();

    multiplier=1;
    gameRunning=true;

    interval=setInterval(()=>{
        multiplier+=0.1;
        document.getElementById("multiplier").innerText=multiplier.toFixed(2)+"x";

        if(Math.random()<0.05){
            crash();
        }
    },200);
}

function cashout(){
    if(!gameRunning) return;

    clearInterval(interval);
    let bet=Number(document.getElementById("bet").value);

    let win=bet*multiplier;
    balance+=win;

    document.getElementById("result").innerText="Won "+win;
    gameRunning=false;
    updateBalance();
}

function crash(){
    clearInterval(interval);
    document.getElementById("multiplier").innerText="CRASH 💥";
    document.getElementById("result").innerText="Lost";
    gameRunning=false;
}

/* DICE */
function playDice(){
    let pick=Number(document.getElementById("dicePick").value);
    let bet=Number(document.getElementById("diceBet").value);

    let roll=Math.floor(Math.random()*6)+1;

    if(pick===roll){
        balance+=bet*5;
        alert("Win!");
    } else balance-=bet;

    updateBalance();
}

/* SPIN */
function spin(){
    let bet=Number(document.getElementById("spinBet").value);

    let mult=[0,2,3,5][Math.floor(Math.random()*4)];

    if(mult===0) balance-=bet;
    else balance+=bet*mult;

    updateBalance();
}

</script>

</body>
</html>
